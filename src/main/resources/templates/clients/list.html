<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>
<div th:replace="~{fragments/header :: container-start}"></div>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-people me-2"></i>Liste des Clients</h2>
    <a href="/clients/add" class="btn btn-success">
        <i class="bi bi-plus-circle me-1"></i>Nouveau Client
    </a>
</div>

<div class="card shadow">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Prénom</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="client : ${clients}" th:id="'row-' + ${client.id}">
                    <td th:text="${client.id}"></td>
                    <td th:text="${client.nom}"></td>
                    <td th:text="${client.prenom}"></td>
                    <td class="text-center">
                        <a th:href="@{/clients/edit/{id}(id=${client.id})}"
                           class="btn btn-warning btn-sm me-1"
                           title="Modifier">
                            <i class="bi bi-pencil-square"></i>
                        </a>
                        <button class="btn btn-danger btn-sm"
                                th:onclick="confirmDelete([[${client.id}]], '[[${client.nom + ' ' + client.prenom}]]')"
                                title="Supprimer">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(clients)}">
                    <td colspan="4" class="text-center text-muted py-4">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        Aucun client enregistré
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
<script>
    function confirmDelete(id, name) {
        swal({
            title: "Êtes-vous sûr ?",
            text: "Vous allez supprimer le client : " + name,
            icon: "warning",
            buttons: ["Annuler", "Supprimer"],
            dangerMode: true,
        }).then((willDelete) => {
            if (willDelete) {
                $.ajax({
                    url: "/clients/delete",
                    type: "POST",
                    data: { id: id },
                    success: function() {
                        $("#row-" + id).remove();
                        swal("Client supprimé avec succès !", {
                            icon: "success",
                        });
                    },
                    error: function() {
                        swal("Erreur serveur !", {
                            icon: "error",
                        });
                    }
                });
            }
        });
    }
</script>
</body>
</html>
