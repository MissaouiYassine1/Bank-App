<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🏦 BanqueApp</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/clients">Clients</a>
            <a class="nav-link text-white" href="/comptes">Comptes</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between mb-3">
        <h2>📋 Liste des Clients</h2>
        <a href="/clients/add" class="btn btn-success">+ Nouveau Client</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th style="width: 150px;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clients}" th:id="'row-' + ${c.id}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nom}"></td>
            <td th:text="${c.prenom}"></td>
            <td>
                <a th:href="@{/clients/edit/{id}(id=${c.id})}" class="btn btn-warning btn-sm">✏️</a>
                <button class="btn btn-danger btn-sm"
                        th:onclick="deleteClient([[${c.id}]], '[[${c.nom}]]')">
                    🗑️
                </button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(clients)}">
            <td colspan="4" class="text-center text-muted">Aucun client</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function deleteClient(id, nom) {
        swal({
            title: "Supprimer ?",
            text: "Client : " + nom,
            icon: "warning",
            buttons: ["Annuler", "Oui"],
            dangerMode: true,
        }).then((ok) => {
            if (ok) {
                $.ajax({
                    url: "/clients/delete",
                    type: "POST",
                    data: { id: id },
                    success: function() {
                        $("#row-" + id).remove();
                        swal("Supprimé !", { icon: "success" });
                    },
                    error: function() {
                        swal("Erreur !", { icon: "error" });
                    }
                });
            }
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
