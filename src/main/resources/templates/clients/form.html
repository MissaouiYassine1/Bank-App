<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>
<div th:replace="~{fragments/header :: container-start}"></div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    <i th:class="${isEdit} ? 'bi bi-pencil-square' : 'bi bi-plus-circle'"></i>
                    <span th:text="${isEdit} ? 'Modifier le Client' : 'Nouveau Client'"></span>
                </h4>
            </div>
            <div class="card-body">
                <form th:action="@{${isEdit} ? '/clients/update/' + ${clientDTO.id} : '/clients/save'}"
                      th:object="${clientDTO}"
                      method="post">

                    <!-- ID caché pour la modification -->
                    <input type="hidden" th:field="*{id}" th:if="${isEdit}"/>

                    <!-- Nom -->
                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom <span class="text-danger">*</span></label>
                        <input type="text"
                               class="form-control"
                               id="nom"
                               th:field="*{nom}"
                               placeholder="Entrez le nom"
                               required>
                        <div class="text-danger" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                    </div>

                    <!-- Prénom -->
                    <div class="mb-3">
                        <label for="prenom" class="form-label">Prénom <span class="text-danger">*</span></label>
                        <input type="text"
                               class="form-control"
                               id="prenom"
                               th:field="*{prenom}"
                               placeholder="Entrez le prénom"
                               required>
                        <div class="text-danger" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>
                    </div>

                    <!-- Boutons -->
                    <div class="d-flex justify-content-between">
                        <a href="/clients" class="btn btn-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Retour
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i>
                            <span th:text="${isEdit} ? 'Modifier' : 'Ajouter'"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
