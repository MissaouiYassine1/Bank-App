<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Compte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🏦 BanqueApp</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/clients">Clients</a>
            <a class="nav-link text-white" href="/comptes">Comptes</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 th:text="${compte.rib != null ? 'Modifier' : 'Nouveau'} + ' Compte'"></h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/comptes/save}" th:object="${compte}" method="post">

                        <div class="mb-3">
                            <label class="form-label">RIB</label>
                            <input type="text" class="form-control" th:field="*{rib}"
                                   th:readonly="${compte.rib != null}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Solde</label>
                            <input type="number" class="form-control" th:field="*{solde}"
                                   step="0.01" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Client</label>
                            <input type="text" id="clientSearch" class="form-control"
                                   placeholder="Rechercher un client..."
                                   th:value="${clientNom}" required>
                            <input type="hidden" name="clientId" id="clientId"
                                   th:value="${compte.client?.id}"/>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/comptes" class="btn btn-secondary">← Retour</a>
                            <button type="submit" class="btn btn-primary">💾 Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    $(function() {
        $("#clientSearch").autocomplete({
            source: function(request, response) {
                $.getJSON("/clients/autocomplete", { term: request.term }, function(data) {
                    response($.map(data, function(item) {
                        return {
                            label: item.label,
                            value: item.value,
                            id: item.id
                        };
                    }));
                });
            },
            minLength: 1,
            select: function(event, ui) {
                $("#clientSearch").val(ui.item.value);
                $("#clientId").val(ui.item.id);
                return false;
            }
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
