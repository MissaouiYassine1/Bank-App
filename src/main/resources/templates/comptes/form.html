<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BanqueApp - <span th:text="${isEdit} ? 'Modifier Compte' : 'Nouveau Compte'"></span></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <link href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i th:class="${isEdit} ? 'bi bi-pencil-square' : 'bi bi-plus-circle'"></i>
                        <span th:text="${isEdit} ? 'Modifier le Compte' : 'Nouveau Compte'"></span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="@{${isEdit} ? '/comptes/update/' + ${compteDTO.rib} : '/comptes/save'}"
                          th:object="${compteDTO}" method="post" id="compteForm">

                        <div class="mb-3">
                            <label for="rib" class="form-label">RIB <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="rib" th:field="*{rib}"
                                   th:readonly="${isEdit}" placeholder="Entrez le RIB" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('rib')}" th:errors="*{rib}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="solde" class="form-label">Solde <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="solde" th:field="*{solde}"
                                   step="0.01" placeholder="Entrez le solde" required>
                            <div class="text-danger" th:if="${#fields.hasErrors('solde')}" th:errors="*{solde}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="clientSearch" class="form-label">Client <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="clientSearch"
                                   placeholder="Recherchez un client..."
                                   th:value="${compteDTO.clientNom != null ? compteDTO.clientNom + ' ' + compteDTO.clientPrenom : ''}"
                                   required>
                            <input type="hidden" id="clientId" th:field="*{clientId}"/>
                            <div class="text-danger" th:if="${#fields.hasErrors('clientId')}" th:errors="*{clientId}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/comptes" class="btn btn-secondary">
                                <i class="bi bi-arrow-left me-1"></i>Retour
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle me-1"></i>
                                <span th:text="${isEdit} ? 'Modifier' : 'Ajouter'"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    $(document).ready(function() {
        $("#clientSearch").autocomplete({
            source: function(request, response) {
                $.ajax({
                    url: "/clients/autocomplete",
                    dataType: "json",
                    data: { term: request.term },
                    success: function(data) {
                        response($.map(data, function(item) {
                            return {
                                label: item.label,
                                value: item.value,
                                id: item.id
                            };
                        }));
                    }
                });
            },
            minLength: 2,
            select: function(event, ui) {
                $("#clientSearch").val(ui.item.value);
                $("#clientId").val(ui.item.id);
                return false;
            }
        });
    });
</script>
</body>
</html>
