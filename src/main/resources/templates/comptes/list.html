<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comptes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">🏦 BanqueApp</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/clients">Clients</a>
            <a class="nav-link text-white" href="/comptes">Comptes</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between mb-3">
        <h2>💰 Liste des Comptes</h2>
        <a href="/comptes/add" class="btn btn-success">+ Nouveau Compte</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-primary">
        <tr>
            <th>RIB</th>
            <th>Solde</th>
            <th>Client</th>
            <th style="width: 150px;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${comptes}" th:id="'row-' + ${c.rib}">
            <td th:text="${c.rib}"></td>
            <td th:text="${#numbers.formatDecimal(c.solde, 0, 'COMMA', 2, 'POINT')} + ' €'"></td>
            <td th:text="${c.client.nom} + ' ' + ${c.client.prenom}"></td>
            <td>
                <a th:href="@{/comptes/edit/{rib}(rib=${c.rib})}" class="btn btn-warning btn-sm">✏️</a>
                <button class="btn btn-danger btn-sm"
                        th:onclick="deleteCompte('[[${c.rib}]]')">
                    🗑️
                </button>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(comptes)}">
            <td colspan="4" class="text-center text-muted">Aucun compte</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function deleteCompte(rib) {
        swal({
            title: "Supprimer ?",
            text: "Compte : " + rib,
            icon: "warning",
            buttons: ["Annuler", "Oui"],
            dangerMode: true,
        }).then((ok) => {
            if (ok) {
                $.ajax({
                    url: "/comptes/delete",
                    type: "POST",
                    data: { rib: rib },
                    success: function() {
                        $("#row-" + rib).remove();
                        swal("Supprimé !", { icon: "success" });
                    },
                    error: function() {
                        swal("Erreur !", { icon: "error" });
                    }
                });
            }
        });
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
