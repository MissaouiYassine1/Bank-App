<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BanqueApp - Comptes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-wallet2 me-2"></i>Liste des Comptes</h2>
        <a href="/comptes/add" class="btn btn-success">
            <i class="bi bi-plus-circle me-1"></i>Nouveau Compte
        </a>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead class="table-primary">
                    <tr>
                        <th>RIB</th>
                        <th>Solde</th>
                        <th>Client</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="compte : ${comptes}" th:id="'row-' + ${compte.rib}">
                        <td th:text="${compte.rib}"></td>
                        <td>
                                    <span th:text="${#numbers.formatDecimal(compte.solde, 0, 'COMMA', 2, 'POINT')} + ' €'"
                                          th:classappend="${compte.solde >= 0} ? 'text-success' : 'text-danger'"></span>
                        </td>
                        <td th:text="${compte.client != null ? compte.client.nom + ' ' + compte.client.prenom : 'N/A'}"></td>
                        <td class="text-center">
                            <a th:href="@{/comptes/edit/{rib}(rib=${compte.rib})}"
                               class="btn btn-warning btn-sm me-1" title="Modifier">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <button class="btn btn-danger btn-sm"
                                    th:onclick="confirmDeleteCompte('[[${compte.rib}]]')"
                                    title="Supprimer">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(comptes)}">
                        <td colspan="4" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            Aucun compte enregistré
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/compte.js"></script>

<script>
    function confirmDeleteCompte(rib) {
        swal({
            title: "Êtes-vous sûr ?",
            text: "Vous allez supprimer le compte : " + rib,
            icon: "warning",
            buttons: ["Annuler", "Supprimer"],
            dangerMode: true,
        }).then((willDelete) => {
            if (willDelete) {
                $.ajax({
                    url: "/comptes/delete",
                    type: "POST",
                    data: { rib: rib },
                    success: function() {
                        $("#row-" + rib).remove();
                        swal("Compte supprimé avec succès !", {
                            icon: "success",
                        });
                    },
                    error: function() {
                        swal("Erreur serveur !", {
                            icon: "error",
                        });
                    }
                });
            }
        });
    }
</script>
</body>
</html>
